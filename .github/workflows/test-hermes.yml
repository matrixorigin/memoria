name: Test Hermes Memory Plugin

on:
  pull_request:
    paths:
      - 'plugins/hermes/**'
      - '.github/workflows/test-hermes.yml'
  push:
    branches: [main]
    paths:
      - 'plugins/hermes/**'
      - '.github/workflows/test-hermes.yml'

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python: ['3.11', '3.12']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          repository: NousResearch/hermes-agent
          ref: 0240fa4a84123406a0e5e6e7262e5b772b43f0bd
          path: .hermes-contract
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '${{ matrix.python }}'
      - run: python -m pip install 'httpx>=0.27,<1' pytest 'ruff==0.16.10' ruamel.yaml python-dotenv rich packaging
      - run: python -m pytest plugins/hermes/tests -q
        env:
          HERMES_SOURCE: '${{ github.workspace }}/.hermes-contract'
      - run: ruff check plugins/hermes
      - run: ruff format --check plugins/hermes
