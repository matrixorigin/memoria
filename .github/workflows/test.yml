name: Test

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

env:
  CARGO_TERM_COLOR: always
  SQLX_OFFLINE: "true"
  DATABASE_URL: mysql://root:111@localhost:6001/memoria_test
  EMBEDDING_PROVIDER: ${{ secrets.EMBEDDING_API_KEY != '' && 'openai' || 'mock' }}
  EMBEDDING_API_KEY: ${{ secrets.EMBEDDING_API_KEY }}
  EMBEDDING_BASE_URL: ${{ vars.EMBEDDING_BASE_URL || '' }}
  EMBEDDING_MODEL: ${{ vars.EMBEDDING_MODEL || 'BAAI/bge-m3' }}
  EMBEDDING_DIM: ${{ vars.EMBEDDING_DIM || '1024' }}
  LLM_API_KEY: ${{ secrets.LLM_API_KEY }}
  LLM_BASE_URL: ${{ vars.LLM_BASE_URL || '' }}
  LLM_MODEL: ${{ vars.LLM_MODEL || '' }}

jobs:
  check:
    name: Check & Clippy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.85.0
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: memoria
          shared-key: memoria-check
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - name: Check & Clippy
        run: cd memoria && cargo check && cargo clippy -- -D warnings

  test-unit:
    name: Unit Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.85.0
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: memoria
          shared-key: memoria-check
          save-if: false
      - name: Unit tests
        run: cd memoria && cargo test --lib -p memoria-api -p memoria-core -p memoria-service -p memoria-mcp

  test-db:
    name: DB Tests
    runs-on: ubuntu-latest
    needs: [check, test-unit]
    services:
      matrixone:
        image: matrixorigin/matrixone:latest
        ports:
          - 6001:6001
        options: --memory=4g
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.85.0
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: memoria
          shared-key: memoria-check
          save-if: false
      - name: Wait for MatrixOne
        run: |
          for i in $(seq 1 30); do
            bash -c 'echo > /dev/tcp/127.0.0.1/6001' 2>/dev/null && break
            echo "Waiting... ($i/30)" && sleep 3
          done
      - name: All tests
        run: cd memoria && cargo test -- --test-threads=1
      - name: Restore transaction failure regression
        run: cd memoria && cargo test -p memoria-git --lib failed_insert_rolls_back_preceding_delete -- --ignored --nocapture
      - name: Branch capability probe cleanup regression
        run: cd memoria && cargo test -p memoria-storage --lib materialized_probe_cleanup_preserves_unrelated_tables -- --ignored --nocapture
      - name: Offline restore cleanup regressions
        run: cd memoria && cargo test -p memoria-git --example restore_cleanup -- --include-ignored --nocapture

  python-sdk:
    name: Python SDK Unit Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install Python SDK test dependencies
        working-directory: sdk/python
        run: python -m pip install -e ".[dev]"
      - name: Run Python SDK unit suite
        working-directory: sdk/python
        run: python -m pytest tests/unit/ -q
